<div class="poll" data-poll-id="{{ .Get "id" }}">
    <h3 class="poll-question">
        {{ .Get "question" }}
    </h3>

    <div class="poll-options">
        <button class="poll-option" data-option="dishwasher">
            🍽️ Dishwasher
        </button>

        <button class="poll-option" data-option="hand-washing">
            🧼 Hand washing
        </button>
    </div>

    <p class="poll-privacy">
        Your vote is completely anonymous. No personal data is collected.
    </p>

    <div class="poll-result" hidden>
        <strong>Your vote is in!</strong>

        <div class="poll-percentages"></div>

        <p class="poll-votes-count"></p>

        <p><strong>Now let's see what the data says.</strong></p>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const poll = document.querySelector(".poll");
    if (!poll) return;

    const pollId = poll.dataset.pollId;
    const buttons = poll.querySelectorAll(".poll-option");

    const result = poll.querySelector(".poll-result");
    const percentages = poll.querySelector(".poll-percentages");
    const votesCount = poll.querySelector(".poll-votes-count");

    const SUPABASE_URL = "https://qaxnrgswltuzjkayskkh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Agh45qyVe7NGG7MnA8bL3Q_QDNPz83U";


    async function loadResults() {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/poll_votes?select=option&poll_id=eq." +
            encodeURIComponent(pollId),
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            const errorText = await response.text();

            console.error(
                "Supabase results error:",
                response.status,
                errorText
            );

            throw new Error("Results could not be loaded.");
        }

        const votes = await response.json();

        console.log("Poll ID:", pollId);
console.log("Votes from Supabase:", votes);
        

        let dishwasherVotes = 0;
        let handWashingVotes = 0;

        votes.forEach(function (vote) {

            if (vote.option === "dishwasher") {
                dishwasherVotes++;
            }

            if (vote.option === "hand-washing") {
                handWashingVotes++;
            }

        });

        const totalVotes = dishwasherVotes + handWashingVotes;

        let dishwasherPercent = 0;
        let handWashingPercent = 0;

        if (totalVotes > 0) {

            dishwasherPercent = Math.round(
                (dishwasherVotes / totalVotes) * 100
            );

            handWashingPercent = Math.round(
                (handWashingVotes / totalVotes) * 100
            );

        }

        percentages.innerHTML = `
            <p>🍽️ Dishwasher: <strong>${dishwasherPercent}%</strong></p>
            <p>🧼 Hand washing: <strong>${handWashingPercent}%</strong></p>
        `;

        votesCount.textContent =
            totalVotes === 1
                ? "1 vote"
                : totalVotes + " votes";
    }


    buttons.forEach(function (button) {

        button.addEventListener("click", async function () {

            const option = this.dataset.option;

            buttons.forEach(function (button) {
                button.disabled = true;
            });

            try {

                const response = await fetch(
                    SUPABASE_URL + "/rest/v1/poll_votes",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Prefer": "return=minimal",
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY
                        },
                        body: JSON.stringify({
                            poll_id: pollId,
                            option: option
                        })
                    }
                );

                if (!response.ok) {

                    const errorText = await response.text();

                    console.error(
                        "Supabase vote error:",
                        response.status,
                        errorText
                    );

                    throw new Error("Vote could not be saved.");
                }

                await loadResults();

                buttons.forEach(function (button) {
                    button.style.display = "none";
                });

                result.hidden = false;

            } catch (error) {

                console.error(error);
                buttons.forEach(function (button) {
                    button.disabled = false;
                });

                alert("Something went wrong. Please try again.");

            }

        });

    });

});
</script>
