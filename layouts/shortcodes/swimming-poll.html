<div class="poll swimming-poll" data-poll-id="{{ .Get "id" }}">
    <h3 class="poll-question">
        {{ .Get "question" }}
    </h3>

    <p class="poll-description">
        Before reading the evidence, what do you think?
    </p>

    <div class="poll-options">

        <button class="poll-option" data-option="digestion-cramps">
            Yes, to give the stomach time to digest food and prevent cramps.
        </button>

        <button class="poll-option" data-option="blood-flow-cramps">
            Yes, because eating sends more blood to the stomach and leaves less for the muscles used for swimming.
        </button>

        <button class="poll-option" data-option="tired-drowning">
            Yes, because swimming after eating could make us tired or weak and increase the risk of drowning.
        </button>

        <button class="poll-option" data-option="dont-believe">
            No, I don't believe we need to wait 30 minutes.
        </button>

    </div>

    <p class="poll-privacy">
        Your vote is completely anonymous. No personal data is collected.
    </p>

    <div class="poll-result" hidden>
        <strong>Your vote is in!</strong>

        <div class="poll-percentages"></div>

        <p class="poll-votes-count"></p>

        <p><strong>Now let's see what the data says.</strong></p>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const poll = document.querySelector(".swimming-poll");;
    if (!poll) return;

    const pollId = poll.dataset.pollId;
    const buttons = poll.querySelectorAll(".poll-option");

    const result = poll.querySelector(".poll-result");
    const percentages = poll.querySelector(".poll-percentages");
    const votesCount = poll.querySelector(".poll-votes-count");

    const SUPABASE_URL = "https://qaxnrgswltuzjkayskkh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Agh45qyVe7NGG7MnA8bL3Q_QDNPz83U";


    async function loadResults() {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/poll_votes?select=option&poll_id=eq." +
            encodeURIComponent(pollId),
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            const errorText = await response.text();

            console.error(
                "Supabase results error:",
                response.status,
                errorText
            );

            throw new Error("Results could not be loaded.");
        }

        const votes = await response.json();

        const voteCounts = {
            "digestion-cramps": 0,
            "blood-flow-cramps": 0,
            "tired-drowning": 0,
            "dont-believe": 0
        };

        votes.forEach(function (vote) {

            if (voteCounts.hasOwnProperty(vote.option)) {
                voteCounts[vote.option]++;
            }

        });

        const totalVotes = votes.length;

        let html = "";

        Object.keys(voteCounts).forEach(function (option) {

            const count = voteCounts[option];

            const percent = totalVotes > 0
                ? Math.round((count / totalVotes) * 100)
                : 0;

            const labels = {
                "digestion-cramps": "Yes, because eating sends more blood to the stomach and leaves less for the muscles used for swimming.",
                "blood-flow-cramps": "Yes, because eating sends more blood to the stomach, leaving less for the muscles we need to swim and causing cramps.",
                "tired-drowning": "Yes, because swimming after eating could make us tired or weak and increase the risk of drowning.",
                "dont-believe": "No, I don't believe we need to wait 30 minutes."
            };

            html += `
                <p>
                    ${labels[option]}:
                    <strong>${percent}%</strong>
                </p>
            `;

        });

        percentages.innerHTML = html;

        votesCount.textContent =
            totalVotes === 1
                ? "1 vote"
                : totalVotes + " votes";
    }


    buttons.forEach(function (button) {

        button.addEventListener("click", async function () {

            const option = this.dataset.option;

            buttons.forEach(function (button) {
                button.disabled = true;
            });

            try {

                const response = await fetch(
                    SUPABASE_URL + "/rest/v1/poll_votes",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Prefer": "return=minimal",
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY
                        },
                        body: JSON.stringify({
                            poll_id: pollId,
                            option: option
                        })
                    }
                );

                if (!response.ok) {

                    const errorText = await response.text();

                    console.error(
                        "Supabase vote error:",
                        response.status,
                        errorText
                    );

                    throw new Error("Vote could not be saved.");
                }

                await loadResults();

                buttons.forEach(function (button) {
                    button.style.display = "none";
                });

                result.hidden = false;

            } catch (error) {

                console.error(error);

                buttons.forEach(function (button) {
                    button.disabled = false;
                });

                alert("Something went wrong. Please try again.");

            }

        });

    });

});
</script>
