<header class="site-header">
  <div class="container nav-wrapper">
    <!-- Brand link: both the logo mark and name lead to the homepage. -->
    <a href="{{ .Site.Home.RelPermalink }}" class="brand-logo" aria-label="Everyday Data home">
      <img src="{{ "images/logo.png" | relURL }}" alt="" class="logo-mark">
      <span class="brand-wordmark">Everyday Data</span>
    </a>

    <!-- Mobile menu button -->
    <button
      class="mobile-menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="main-navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Nav menu -->
    <nav id="main-navigation" aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="{{ .Site.Home.RelPermalink }}" class="{{ if .IsHome }}active{{ end }}">Home</a></li>
        <li><a href="{{ "research/" | relURL }}" class="{{ if eq .Section "research" }}active{{ end }}">Research</a></li>
        <li><a href="{{ "about/" | relURL }}" class="{{ if eq .RelPermalink ("about/" | relURL) }}active{{ end }}">About</a></li>
      </ul>
    </nav>
  </div>
</header>
