<header class="site-header">
  <div class="container nav-wrapper">
    <!-- Logo) -->
    <a href="{{ .Site.Home.RelPermalink }}" class="brand-logo">
      <img src="{{ "images/logo.png" | absURL }}" alt="Everyday Data Logo" class="logo-img">
    </a>

    <!-- Nav menu -->
    <nav aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="{{ .Site.Home.RelPermalink }}" class="{{ if .IsHome }}active{{ end }}">Home</a></li>
        <li><a href="{{ "research/" | relURL }}" class="{{ if eq .Section "research" }}active{{ end }}">Research</a></li>
        <li><a href="{{ "about/" | relURL }}" class="{{ if or (eq .Type "about") (eq .Section "about") }}active{{ end }}">About</a></li>
      </ul>
    </nav>
  </div>
</header>
