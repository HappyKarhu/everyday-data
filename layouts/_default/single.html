{{ define "main" }}

<section class="page-single">
    <div class="container">

        <header class="page-header">
            <h1>{{ .Title }}</h1>
        </header>

        <article class="page-body">

            {{ .Content }}

            <!-- share buttons -->
            <div class="article-share">

                <span>Think these findings are worth sharing?</span>

                <div class="article-share-links">

                    <a
                        href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Share on Facebook">
                        Facebook
                    </a>

                    <a
                        href="https://twitter.com/intent/tweet?url={{ .Permalink }}&text={{ .Title }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Share on X">
                        X
                    </a>

                    <a
                        href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Share on LinkedIn">
                        LinkedIn
                    </a>

                    <a
                        href="mailto:?subject={{ .Title }}&body=I thought you might find this interesting: {{ .Permalink }}"
                        aria-label="Share by email">
                        Email
                    </a>

                </div>

            </div>

        </article>

    </div>
</section>

{{ end }}
