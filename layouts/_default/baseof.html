<!DOCTYPE html>
<html lang="{{ .Language.Lang | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Prevents dark-mode/loading white flash & colors mobile browser header -->
  <meta name="theme-color" content="#E5E0D6">
  <style>
    /* Critical inline background color to prevent flash before CSS loads */
    html { background-color: #E5E0D6; color-scheme: light; }
  </style>

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

  <!-- Hugo CSS Pipeline -->
  {{ with resources.Get "css/main.css" }}
  {{ $secureCSS := . | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $secureCSS.RelPermalink }}" integrity="{{ $secureCSS.Data.Integrity }}">
{{ end }}
</head>
<body>

  <!-- call for partials/header.html -->
  {{ partial "header.html" . }}

  <section class="page-content">
  <!-- Main Content Block -->
  <main>
    {{ block "main" . }}{{ end }}
  </main>

    <!-- Footer -->
    {{ partial "footer.html" . }}

 </section>

  <script>
    window.LOCALE = "en";
    window.EMAIL_INVALID_MESSAGE = "Please enter a valid email address.";
    window.REQUIRED_ERROR_MESSAGE = "This field cannot be left blank.";
    window.GENERIC_INVALID_MESSAGE = "The information provided is invalid. Please review it and try again.";
    var AUTOHIDE = Boolean(1);
  </script>
  <script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>

<script>
  const successMessage = document.getElementById("success-message");

  if (successMessage) {
    const observer = new MutationObserver(() => {
      if (getComputedStyle(successMessage).display === "none") {
        successMessage.style.display = "block";
      }
    });

    observer.observe(successMessage, {
      attributes: true,
      attributeFilter: ["class", "style"]
    });
  }
</script>

</body>
</html>
