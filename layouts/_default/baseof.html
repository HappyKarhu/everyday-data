<!DOCTYPE html>
<html lang="{{ .Language.Lang | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Prevents dark-mode/loading white flash & colors mobile browser header -->
  <meta name="theme-color" content="#E5E0D6">
  <style>
    /* Critical inline background color to prevent flash before CSS loads */
    html { background-color: #E5E0D6; color-scheme: light; }
  </style>

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

  <!-- Hugo CSS Pipeline -->
  {{ with resources.Get "css/main.css" }}
  {{ $secureCSS := . | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $secureCSS.RelPermalink }}" integrity="{{ $secureCSS.Data.Integrity }}">
{{ end }}
</head>
<body>

  <!-- call for partials/header.html -->
  {{ partial "header.html" . }}

  <section class="page-content">
  <!-- Main Content Block -->
  <main>
    {{ block "main" . }}{{ end }}
  </main>

    <!-- Footer -->
    {{ partial "footer.html" . }}

 </section>

  <script>
    window.REQUIRED_CODE_ERROR_MESSAGE = 'Please choose a country code';
    window.LOCALE = 'en';
    window.EMAIL_INVALID_MESSAGE = window.SMS_INVALID_MESSAGE = "The information provided is invalid. Please review the field format and try again.";
    window.REQUIRED_ERROR_MESSAGE = "This field cannot be left blank.";
    window.GENERIC_INVALID_MESSAGE = "The information provided is invalid. Please review the field format and try again.";
    window.INVALID_NUMBER = "The information provided is invalid. Please review the field format and try again.";
    window.INVALID_DATE = "Please enter a valid date";
    window.REQUIRED_MULTISELECT_MESSAGE = 'Please select at least 1 option';
    window.translation = {
      common: {
        selectedList: '{quantity} list selected',
        selectedLists: '{quantity} lists selected',
        selectedOption: '{quantity} selected',
        selectedOptions: '{quantity} selected',
      }
    };
    var AUTOHIDE = Boolean(1);
  </script>
  
  <!--
<script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>
-->

<script>
document.addEventListener("DOMContentLoaded", function () {

  const counter = document.getElementById("year-glass-count");
  const visual = document.getElementById("year-glass-visual");

  if (!counter || !visual) return;

  const target = 35040;
  const step = 48;
  const start = 48;

  let current = start;

  function updateVisual() {

    if (current >= target) {
      counter.textContent = target.toLocaleString("en-US");
      return;
    }

    current += step;

    if (current > target) {
      current = target;
    }

    /* Add 48 new glasses */
    for (let i = 0; i < step; i++) {
      const glass = document.createElement("img");

      glass.className = "glass-animation-item";
      glass.src = visual.querySelector("img").src;
      glass.alt = "";

      visual.appendChild(glass);
    }

    /* Make individual glasses smaller as their number grows */
    const scale = Math.sqrt(start / current);
    const size = 55 * scale;

    visual.querySelectorAll(".glass-animation-item").forEach(function (glass) {
      glass.style.width = size + "px";
    });

    counter.textContent = current.toLocaleString("en-US");

    setTimeout(updateVisual, 30);
  }

  updateVisual();

});
</script>

</body>
</html>
