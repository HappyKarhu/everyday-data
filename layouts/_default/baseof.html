<!DOCTYPE html>
<html lang="{{ .Language.Lang | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Prevents dark-mode/loading white flash & colors mobile browser header -->
  <meta name="theme-color" content="#E5E0D6">
  <style>
    /* Critical inline background color to prevent flash before CSS loads */
    html { background-color: #E5E0D6; color-scheme: light; }
  </style>

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

  <!-- Hugo CSS Pipeline -->
  {{ $css := resources.Get "css/main.css" | resources.Minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>

  <!-- call for partials/header.html -->
  {{ partial "header.html" . }}

  <!-- Main Content Block -->
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ now.Format "2006" }} Everyday Data. Transparent research & analysis.</p>
    </div>
  </footer>

</body>
</html>
